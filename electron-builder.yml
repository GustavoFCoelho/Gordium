appId: io.github.gustavofcoelho.gordium
productName: Gordium
directories:
  output: dist
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/wintun/${arch}/wintun.dll
    to: wintun/wintun.dll
  - from: resources/wintun/LICENSE.txt
    to: wintun/LICENSE.txt
win:
  target: nsis
  icon: build/icon.ico
  # O app roda como usuário comum; só o processo da VPN (Gordium.exe --vpn-helper)
  # é elevado, pelo UAC, quando a VPN é ligada.
  artifactName: Gordium-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Endurecimento do executável: o mesmo Gordium.exe roda como administrador no
# processo da VPN, então ele não pode virar um Node.js genérico (ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS, --inspect) e só roda o código do app.asar, conferido pelo hash
# gravado no próprio executável.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# O app instalado procura atualizações nas Releases deste repositório (precisa ser público).
# A release é criada pelo workflow .github/workflows/release.yml a cada push na main.
publish:
  provider: github
  owner: GustavoFCoelho
  repo: Gordium
  releaseType: release
